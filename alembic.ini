# Alembic Configuration File

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
; sqlalchemy.url is intentionally omitted so migrations read DATABASE_URL from the environment
; Set DATABASE_URL in your environment or in the project's .env file

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
